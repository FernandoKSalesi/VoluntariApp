version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: voluntariapp-mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voluntariapp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: voluntariapp-adminer
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  mysql_data:
